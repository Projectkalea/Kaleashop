<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kalea | Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a0c;
    --panel:#141417;
    --panel-2:#1c1c21;
    --text:#f3f3f5;
    --muted:#9a9aa4;
    --line:rgba(255,255,255,.08);
    --radius:16px;
  }

  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }

  body::before{
    content:"";
    position:fixed; inset:0;
    background:
      radial-gradient(900px 500px at 50% -10%, rgba(80,80,140,.16), transparent 65%),
      radial-gradient(700px 400px at 100% 100%, rgba(40,120,160,.10), transparent 60%);
    pointer-events:none; z-index:0;
  }

  .wrap{position:relative; z-index:1; max-width:912px; margin:0 auto; padding:0 24px}

  /* ---------- header ---------- */
  header{padding:26px 0 8px}
  .bar{display:flex; align-items:center; justify-content:space-between; gap:16px}
  .brand{display:flex; align-items:center; gap:9px; font-weight:800; font-size:15px; letter-spacing:-.01em; color:#fff; text-decoration:none}
  .brand .mark{
    width:24px; height:24px; border-radius:7px;
    background:linear-gradient(140deg,#5b7cff,#8a5bff);
    display:grid; place-items:center; font-size:13px; color:#fff;
    box-shadow:0 4px 14px rgba(90,110,255,.35);
  }

  .discord-btn{
    display:inline-flex; align-items:center; gap:9px;
    background:#5865F2; color:#fff; text-decoration:none;
    font:inherit; font-weight:700; font-size:13.5px;
    padding:7px 16px 7px 12px; border-radius:999px; border:0; cursor:pointer;
    transition:filter .18s ease, transform .18s ease;
  }
  .discord-btn:hover{filter:brightness(1.1); transform:translateY(-1px)}

  .account{position:relative}
  .account-btn{
    display:flex; align-items:center; gap:9px;
    background:var(--panel); border:1px solid var(--line);
    color:#fff; font:inherit; font-weight:700; font-size:13.5px;
    padding:7px 14px 7px 8px; border-radius:999px; cursor:pointer;
    transition:background .18s ease, border-color .18s ease;
  }
  .account-btn:hover{background:var(--panel-2); border-color:rgba(255,255,255,.16)}
  .avatar{width:24px; height:24px; border-radius:50%; background:#2b2b33; object-fit:cover}
  .avatar-fallback{
    width:24px; height:24px; border-radius:50%;
    background:linear-gradient(140deg,#2b2b33,#4a4a58);
    display:grid; place-items:center; font-size:11px; color:#c9c9d4;
  }
  .badge{
    font-size:10px; font-weight:800; letter-spacing:.03em;
    padding:2px 7px; border-radius:999px;
    background:rgba(88,101,242,.22); color:#a9b3ff; border:1px solid rgba(88,101,242,.4);
  }
  .badge.off{background:rgba(255,255,255,.07); color:var(--muted); border-color:var(--line)}

  .menu{
    position:absolute; right:0; top:calc(100% + 10px);
    min-width:246px; background:var(--panel);
    border:1px solid var(--line); border-radius:14px;
    padding:12px; z-index:20;
    box-shadow:0 24px 60px rgba(0,0,0,.6);
    opacity:0; visibility:hidden; transform:translateY(-6px);
    transition:.18s ease;
  }
  .menu.open{opacity:1; visibility:visible; transform:translateY(0)}
  .menu .who{display:flex; align-items:center; gap:10px; margin-bottom:12px}
  .menu .who .avatar{width:34px; height:34px}
  .menu .who .nm{font-size:13px; font-weight:800; line-height:1.2}
  .menu .who .un{font-size:11.5px; color:var(--muted)}
  .menu .label{font-size:11px; color:var(--muted); font-weight:600; margin-bottom:4px}
  .menu .id{font-size:11.5px; color:#d5d5de; word-break:break-all; line-height:1.45; margin-bottom:12px}
  .menu button, .menu a{
    display:flex; align-items:center; gap:8px; width:100%; text-align:left;
    background:transparent; border:0; color:#e7e7ee;
    font:inherit; font-weight:700; font-size:13px;
    padding:9px 10px; border-radius:9px; cursor:pointer; text-decoration:none;
  }
  .menu button:hover, .menu a:hover{background:var(--panel-2)}
  .menu .danger{color:#ff8080}

  /* ---------- banner ---------- */
  .banner{
    margin-top:14px; padding:11px 16px; border-radius:12px;
    font-size:13px; font-weight:600;
    background:rgba(255,90,90,.10); border:1px solid rgba(255,90,90,.30); color:#ffb3b3;
  }
  .banner.ok{background:rgba(80,220,150,.10); border-color:rgba(80,220,150,.3); color:#9ff0c6}

  /* ---------- hero ---------- */
  .hero{text-align:center; padding:52px 0 34px}
  .hero h1{font-size:44px; font-weight:800; letter-spacing:-.02em; margin:0 0 16px}
  .hero p{color:var(--muted); font-size:14.5px; line-height:1.65; margin:0 auto; max-width:520px}

  /* ---------- sections ---------- */
  .section{margin:38px 0}
  .section-head{display:flex; align-items:baseline; gap:9px; margin:0 0 14px 2px}
  .section-head h2{font-size:14.5px; font-weight:800; margin:0; letter-spacing:-.01em}
  .section-head span{color:var(--muted); font-size:12.5px; font-weight:600}

  /* ---------- bundle card ---------- */
  .card{
    position:relative; display:block; text-decoration:none; color:inherit;
    border-radius:var(--radius); padding:26px 30px 24px;
    min-height:198px; overflow:hidden; isolation:isolate;
    border:1px solid rgba(255,255,255,.10);
    transition:transform .22s cubic-bezier(.2,.7,.3,1), box-shadow .22s ease, border-color .22s ease;
  }
  .card + .card{margin-top:14px}
  .card:hover{transform:translateY(-3px); border-color:rgba(255,255,255,.22)}
  .card .glow{
    position:absolute; right:-60px; top:-90px; width:340px; height:340px;
    border-radius:50%; filter:blur(70px); opacity:.55; z-index:-1;
  }
  /* illustration SVG (placeholder original) */
  .card .art{
    position:absolute; right:26px; bottom:-14px; width:300px; height:220px;
    z-index:-1; opacity:.95; pointer-events:none;
  }
  /* vraie image déposée dans public/img/ — se fond dans la carte comme l'original */
  .card img.art{
    right:0; bottom:0; left:auto; top:0;
    width:min(46%, 420px); height:100%;
    object-fit:cover; object-position:center bottom;
    z-index:-1; opacity:1;
    -webkit-mask-image:linear-gradient(to right, transparent 0%, #000 26%, #000 100%);
            mask-image:linear-gradient(to right, transparent 0%, #000 26%, #000 100%);
  }
  .card h3{margin:0 0 10px; font-size:31px; font-weight:800; letter-spacing:-.02em; line-height:1.1}
  .card .desc{margin:0 0 14px; font-size:13px; font-weight:700; line-height:1.5; max-width:470px}
  .card ul{margin:0 0 16px; padding:0; list-style:none; max-width:420px}
  .card li{font-size:12.5px; line-height:1.85; color:rgba(255,255,255,.86)}
  .card li::before{content:"•"; margin-right:8px; opacity:.8}
  .card li.more{color:rgba(255,255,255,.55); font-weight:600}
  .card .price{font-size:20px; font-weight:800; letter-spacing:-.01em}

  /* palettes */
  .t-gold  .glow{background:#c99a10}
  .t-gold  {background:linear-gradient(115deg,#241a04 0%,#4d3a06 55%,#7a5c07 100%); border-color:rgba(240,180,60,.32)}
  .t-gold  h3{color:#f5b32b}
  .t-gold:hover{box-shadow:0 22px 60px rgba(200,150,20,.20)}

  .t-cyan  .glow{background:#0fb6d8}
  .t-cyan  {background:linear-gradient(115deg,#08343f 0%,#0d5767 55%,#12809b 100%); border-color:rgba(60,210,240,.32)}
  .t-cyan  h3{color:#35cdf0}
  .t-cyan:hover{box-shadow:0 22px 60px rgba(20,170,200,.20)}

  .t-purple .glow{background:#7b3ff0}
  .t-purple{background:linear-gradient(115deg,#241046 0%,#3f1f78 60%,#5b33a8 100%); border-color:rgba(170,130,255,.30)}
  .t-purple h3{color:#c9a6ff}
  .t-purple:hover{box-shadow:0 22px 60px rgba(120,60,220,.22)}

  .t-teal  .glow{background:#0fb6a8}
  .t-teal  {background:linear-gradient(115deg,#07383c 0%,#0c626a 55%,#11949e 100%); border-color:rgba(60,220,210,.30)}
  .t-teal  h3{color:#3ad7e0}
  .t-teal:hover{box-shadow:0 22px 60px rgba(20,190,180,.20)}

  .t-flame .glow{background:#e05a10}
  .t-flame {background:linear-gradient(115deg,#2a0f1a 0%,#5c2110 55%,#3a1050 100%); border-color:rgba(240,120,40,.30)}
  .t-flame h3{color:#f06a1e}
  .t-flame:hover{box-shadow:0 22px 60px rgba(220,90,30,.20)}

  .t-violet .glow{background:#9b4bff}
  .t-violet{background:linear-gradient(115deg,#1c0d33 0%,#331653 55%,#4a1f7a 100%); border-color:rgba(180,120,255,.30)}
  .t-violet h3{color:#d0a8ff}
  .t-violet:hover{box-shadow:0 22px 60px rgba(140,70,240,.22)}

  .locked{opacity:.55; pointer-events:none; filter:saturate(.4)}

  /* ---------- sticky scroll pill ---------- */
  .scroll-pill{
    position:fixed; left:50%; bottom:22px; transform:translate(-50%,0);
    display:flex; align-items:center; gap:9px;
    background:#f4f4f6; color:#111114;
    border:0; border-radius:999px; padding:11px 22px;
    font:inherit; font-weight:700; font-size:13.5px; cursor:pointer;
    box-shadow:0 16px 44px rgba(0,0,0,.55);
    z-index:30; transition:opacity .25s ease, transform .25s ease;
  }
  .scroll-pill:hover{background:#fff}
  .scroll-pill.hide{opacity:0; transform:translate(-50%,14px); pointer-events:none}
  .scroll-pill svg{transition:transform .2s ease}
  .scroll-pill:hover svg{transform:translateY(2px)}

  footer{text-align:center; padding:46px 0 92px; color:var(--muted); font-size:12.5px}
  footer a{color:#cfcfda; text-decoration:underline; text-underline-offset:2px}

  .join{
    display:inline-flex; align-items:center; gap:8px;
    background:#5865F2; color:#fff; text-decoration:none;
    font-weight:700; font-size:13px; padding:8px 16px; border-radius:999px;
    transition:filter .18s ease, transform .18s ease;
  }
  .join:hover{filter:brightness(1.1); transform:translateY(-1px)}

  @media (max-width:720px){
    .hero h1{font-size:32px}
    .card{padding:22px 20px; min-height:0}
    .card h3{font-size:24px}
    .card .art{opacity:.28; right:-30px}
    .card .desc,.card ul{max-width:none}
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="bar">
      <a class="brand" href="#">
        <span class="mark">K</span>
        <span>Kalea</span>
      </a>
      <div id="authArea"></div>
    </div>
    <div id="banner"></div>
  </header>

  <section class="hero">
    <h1>Kalea Store</h1>
    <p>Support the server and get something back. Everything here lands in your locker as an in-game gift.</p>
    <p style="margin-top:18px"><a class="join" href="https://discord.gg/kaleafn" target="_blank" rel="noopener">💬 discord.gg/kaleafn</a></p>
  </section>

  <div id="store"></div>

  <footer id="footer"></footer>
</div>

<button class="scroll-pill" id="scrollPill">
  <span id="scrollLabel">Scroll down for 7 more bundles</span>
  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M19 12l-7 7-7-7"/></svg>
</button>

<script>
/* ---------------- catalogue (remplace par tes vrais lots) ---------------- */
const SECTIONS = [
  { title:'Full Locker', items:[{
    theme:'t-gold', title:'Full Locker', price:'$30', img:'img/full-locker.png',
    desc:'Every cosmetic, emote, and item unlocked.',
    list:[], art:'crown'
  }]},
  { title:'Custom Cosmetics', items:[
    { theme:'t-cyan', title:'All Custom Cosmetics', price:'$40', img:'img/all-custom.png',
      desc:'Every Kalea custom cosmetic, plus every custom cosmetic we add in the future.',
      list:['Neon Drift outfit','Glitchwave outfit','Aurora Scout outfit','Coastal Machinist outfit','Heartseeker outfit','and 34 more'],
      moreIndex:5, art:'gift' },
    { theme:'t-teal', title:'Season Custom Set', price:'$15', img:'img/season-set.png',
      desc:'The rotating picks of the current season, delivered to your locker.',
      list:['Voltage Raider outfit','Frostbyte pickaxe','Pulse Wave emote','and 11 more'],
      moreIndex:3, art:'star' },
    { theme:'t-purple', title:'Summer Exclusives Set', price:'$10', img:'img/summer.png',
      desc:'The Island is one giant party.',
      list:['Coastal outfit','Thudthumper pickaxe','Lovelyn pickaxe','Atmosphere emote','There She Goes emote'],
      art:'sun' }
  ]},
  { title:'Monthly Bundles', items:[
    { theme:'t-flame', title:'Sweat Donator 1', price:'$15', img:'img/sweat-1.png',
      desc:'Show your true self with these cosmetics, including a bunch of cosmetics that are all backported from the most used cosmetics in latest season.',
      list:['Rockstar LISA outfit','Magik outfit','Zoey outfit','Sparx outfit','Mongraal outfit','and 15 more'],
      moreIndex:5, art:'bolt' },
    { theme:'t-violet', title:'Sweat Donator Small 1', price:'$10', img:'img/sweat-small.png',
      desc:'A smaller version of the highly requested sweat donator bundle.',
      list:['Training Bot outfit','Slim Shady outfit','Axe \'Bout Me pickaxe','The Axe of Champions 2.0 pickaxe','and 5 more'],
      moreIndex:4, art:'bolt' }
  ]},
  { title:'Starter Packs', items:[{
    theme:'t-violet', title:'Starter Pack', price:'$5', img:'img/starter.png',
    desc:'Essential cosmetics for new players who want to stand out right away.',
    list:['Recruit outfit','Basic Blade pickaxe','Welcome emote'], art:'box'
  }]}
];

/* ---------------- illustrations vectoriales ---------------- */
const ART = {
  crown:`<defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe08a"/><stop offset=".5" stop-color="#e0a915"/><stop offset="1" stop-color="#8a6506"/></linearGradient></defs>
    <path d="M40 175 L25 60 L105 118 L150 35 L195 118 L275 60 L260 175 Z" fill="url(#g1)"/>
    <rect x="40" y="175" width="220" height="26" rx="8" fill="url(#g1)"/>
    <circle cx="25" cy="55" r="14" fill="#ffe9a8"/><circle cx="150" cy="30" r="16" fill="#fff0bd"/><circle cx="275" cy="55" r="14" fill="#ffe9a8"/>`,
  gift:`<defs><linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9ff2ff"/><stop offset="1" stop-color="#0e7d99"/></linearGradient></defs>
    <rect x="105" y="80" width="120" height="120" rx="18" fill="url(#g2)"/>
    <rect x="153" y="80" width="24" height="120" fill="#0a4e60" opacity=".55"/>
    <rect x="105" y="128" width="120" height="24" fill="#0a4e60" opacity=".55"/>
    <path d="M165 80c-26-30-64-6-38 16 14 12 38 20 38 20s24-8 38-20c26-22-12-46-38-16Z" fill="#d8fbff" opacity=".9"/>`,
  star:`<defs><linearGradient id="g3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a6fff2"/><stop offset="1" stop-color="#0b7f78"/></linearGradient></defs>
    <path d="M150 30l26 62 66 6-50 44 15 65-57-35-57 35 15-65-50-44 66-6Z" fill="url(#g3)"/>`,
  sun:`<defs><linearGradient id="g4" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e2cdff"/><stop offset="1" stop-color="#5b2ea8"/></linearGradient></defs>
    <path d="M60 190c0-70 40-120 90-120s90 50 90 120Z" fill="url(#g4)" opacity=".85"/>
    <circle cx="150" cy="66" r="34" fill="url(#g4)"/>
    <rect x="96" y="150" width="108" height="18" rx="9" fill="#2a1150" opacity=".5"/>`,
  bolt:`<defs><linearGradient id="g5" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd27a"/><stop offset="1" stop-color="#8a2b06"/></linearGradient></defs>
    <path d="M170 15 120 110h40l-30 95 90-118h-44l36-72Z" fill="url(#g5)"/>`,
  box:`<defs><linearGradient id="g7" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f0d8ff"/><stop offset="1" stop-color="#6a2eb8"/></linearGradient></defs>
    <rect x="90" y="95" width="130" height="105" rx="14" fill="url(#g7)"/>
    <rect x="82" y="72" width="146" height="34" rx="10" fill="url(#g7)" opacity=".85"/>
    <rect x="146" y="72" width="18" height="128" fill="#33165e" opacity=".45"/>`
};

function cardHTML(b){
  const list = b.list.map((li,i)=>
    `<li class="${b.moreIndex===i?'more':''}">${li}</li>`).join('');
  /* si une image est déposée dans public/img/, elle remplace l'illustration SVG.
     Si le fichier n'existe pas encore, on retombe automatiquement sur le SVG. */
  const svg = `<svg class="art" viewBox="0 0 300 220" fill="none" aria-hidden="true">${ART[b.art]}</svg>`;
  /* L'illustration SVG reste en dessous. Si l'image existe, elle la recouvre
     au chargement ; sinon elle se retire et le SVG est visible. */
  const art = svg + (b.img ? `
    <img class="art" src="${b.img}" alt=""
         onload="this.previousElementSibling.style.display='none'"
         onerror="this.remove()">` : '');
  return `<a class="card ${b.theme}" href="#bundle">
    <span class="glow"></span>
    ${art}
    <h3>${b.title}</h3>
    <p class="desc">${b.desc}</p>
    ${list?`<ul>${list}</ul>`:''}
    <div class="price">${b.price}</div>
  </a>`;
}

document.getElementById('store').innerHTML = SECTIONS.map(s=>`
  <div class="section">
    <div class="section-head"><h2>${s.title}</h2><span>${s.items.length}</span></div>
    ${s.items.map(cardHTML).join('')}
  </div>`).join('');

/* ---------------- auth ---------------- */
const authArea = document.getElementById('authArea');
const footer  = document.getElementById('footer');
let session = null;

const discordIcon = `<svg width="18" height="14" viewBox="0 0 24 18" fill="currentColor" aria-hidden="true"><path d="M20.3 1.5A19.8 19.8 0 0 0 15.4 0c-.2.4-.5.9-.7 1.3a18.3 18.3 0 0 0-5.4 0C9.1.9 8.8.4 8.6 0 6.9.3 5.2.8 3.7 1.5 1.2 5.3.4 9 .8 12.6c1.9 1.4 3.7 2.2 5.5 2.8.4-.6.9-1.3 1.3-2-.7-.3-1.4-.6-2-1l.5-.4c3.9 1.8 8.2 1.8 12.1 0l.5.4c-.6.4-1.3.7-2 1 .4.7.8 1.4 1.3 2 1.8-.6 3.6-1.4 5.5-2.8.5-4.2-.8-7.9-3.2-11.1ZM8.3 10.3c-1 0-1.9-1-1.9-2.1S7.2 6.1 8.3 6.1s1.9 1 1.9 2.1-0.9 2.1-1.9 2.1Zm7.4 0c-1 0-1.9-1-1.9-2.1s.9-2.1 1.9-2.1 1.9 1 1.9 2.1-.9 2.1-1.9 2.1Z"/></svg>`;

function signedOutUI(){
  authArea.innerHTML = `<a class="discord-btn" href="/auth/login">${discordIcon}<span>Sign in with Discord</span></a>`;
  footer.innerHTML = `Signed in as <strong style="color:#cfcfda">Guest</strong> · <a href="/auth/login">Sign in with Discord</a>`;
}

function signedInUI(data){
  const u = data.user;
  const badge = data.isMember === true  ? `<span class="badge">MEMBER</span>`
              : data.isMember === false ? `<span class="badge off">NOT IN SERVER</span>` : '';
  const av = u.avatar
    ? `<img class="avatar" src="${u.avatar}" alt="">`
    : `<span class="avatar-fallback">${u.global_name[0]}</span>`;

  authArea.innerHTML = `
    <div class="account">
      <button class="account-btn" id="accountBtn" aria-haspopup="true" aria-expanded="false">
        ${av}<span>${u.global_name}</span>${badge}
      </button>
      <div class="menu" id="accountMenu" role="menu">
        <div class="who">${av}<div><div class="nm">${u.global_name}</div><div class="un">@${u.username}</div></div></div>
        <div class="label">Account ID</div>
        <div class="id">${u.id}</div>
        <button id="copyId">Copy account ID</button>
        <a href="https://discord.gg/kaleafn" target="_blank" rel="noopener">Join Discord server</a>
        <button class="danger" id="logoutBtn">Sign out</button>
      </div>
    </div>`;

  footer.innerHTML = `Signed in as <strong style="color:#cfcfda">${u.global_name}</strong> · <a href="#" id="notYou">Not you?</a>`;

  const btn = document.getElementById('accountBtn');
  const menu = document.getElementById('accountMenu');
  btn.addEventListener('click', e=>{
    e.stopPropagation();
    const open = menu.classList.toggle('open');
    btn.setAttribute('aria-expanded', open);
  });
  document.addEventListener('click', ()=>{
    menu.classList.remove('open');
    btn.setAttribute('aria-expanded','false');
  });

  document.getElementById('copyId').addEventListener('click', function(){
    navigator.clipboard?.writeText(u.id);
    this.textContent = 'Copied!';
    setTimeout(()=>this.textContent='Copy account ID', 1400);
  });

  const doLogout = async () => {
    await fetch('/auth/logout', { method:'POST' });
    session = null;
    signedOutUI();
    applyLock();
  };
  document.getElementById('logoutBtn').addEventListener('click', doLogout);
  document.getElementById('notYou')?.addEventListener('click', e=>{ e.preventDefault(); doLogout(); });
}

/* Les bundles sont visibles par tout le monde ; mets requireAuth:true
   pour réserver un lot aux membres connectés. */
function applyLock(){
  document.querySelectorAll('.card').forEach(c=>c.classList.remove('locked'));
}

/* messages d'erreur / succès OAuth */
function showBanner(){
  const p = new URLSearchParams(location.search);
  const err = p.get('auth_error');
  const ok  = p.get('auth');
  const box = document.getElementById('banner');
  const M = {
    config:'Serveur mal configuré : DISCORD_CLIENT_ID / DISCORD_CLIENT_SECRET absents du .env',
    state:'Session de sécurité expirée. Réessaie la connexion.',
    access_denied:'Connexion annulée sur Discord.',
    exchange:'Échange du code OAuth échoué. Vérifie le Redirect URI dans ton application Discord.',
    no_code:'Discord n\'a pas renvoyé de code.'
  };
  if (err) box.innerHTML = `<div class="banner">${M[err] || 'Erreur : ' + err}</div>`;
  else if (ok) box.innerHTML = `<div class="banner ok">Connecté avec Discord ✔</div>`;
  if (err || ok) history.replaceState(null,'',location.pathname);
}
showBanner();

(async function boot(){
  try{
    const r = await fetch('/api/me', { headers:{ Accept:'application/json' } });
    session = await r.json();
  }catch{ session = { user:null }; }
  if (session?.user) signedInUI(session); else signedOutUI();
  applyLock();
})();

/* ---------------- sticky "scroll down for N more bundles" ---------------- */
const pill = document.getElementById('scrollPill');
const label = document.getElementById('scrollLabel');
const cards = [...document.querySelectorAll('.card')];

function updatePill(){
  const viewportBottom = window.innerHeight;
  let remaining = 0;
  for (const card of cards){
    if (card.getBoundingClientRect().top > viewportBottom) remaining++;
  }
  const atBottom = window.innerHeight + window.scrollY >= document.body.scrollHeight - 80;
  if (atBottom || remaining === 0){
    pill.classList.add('hide');
  } else {
    pill.classList.remove('hide');
    label.textContent = `Scroll down for ${remaining} more bundle${remaining===1?'':'s'}`;
  }
}
window.addEventListener('scroll', updatePill, {passive:true});
window.addEventListener('resize', updatePill);
pill.addEventListener('click', () => window.scrollBy({top: window.innerHeight * .9, behavior:'smooth'}));
updatePill();
</script>
